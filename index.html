<style>
/* Identidade MF Imports: preto quente e dourado, tirados do logo.
   Tema único e assumido — a marca dela é preta, não faz sentido clarear. */
:root{
  color-scheme:dark;
  --bg:#0A0908; --surface:#131110; --surface-2:#1C1917; --surface-3:#262220;
  --line:#2A2521; --line-2:#3E3730;
  --ink:#F6F1E7; --ink-2:#BEB4A3; --ink-3:#8C8372;
  --gold:#D8AE58; --gold-2:#F3E0A8; --gold-3:#A97C22;
  --gold-soft:#241D10;
  --accent:#D8AE58; --accent-ink:#0E0B06; --accent-soft:#241C10; --accent-line:#4A3B17;
  --good:#5CBE92; --good-soft:#122A20;
  --warn:#E08A3C; --warn-soft:#2E1D0E;
  --bad:#E4707C;  --bad-soft:#2F1418;
  --shadow-1:0 1px 2px rgba(0,0,0,.5);
  --shadow-2:0 2px 6px rgba(0,0,0,.45),0 16px 34px -18px rgba(0,0,0,.9);
  --r:14px; --r-sm:10px;
  --tabh:62px;
}

*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.45; -webkit-text-size-adjust:100%;
  overflow-x:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{max-width:600px;margin:0 auto;padding:0 14px calc(var(--tabh) + 84px + env(safe-area-inset-bottom,0px));}
.topbar{
  position:sticky;top:0;z-index:40;background:var(--bg);
  display:flex;align-items:center;gap:10px;
  padding:14px 0 10px;border-bottom:1px solid var(--accent-line);margin-bottom:16px;
}

.brand{display:flex;align-items:center;gap:9px;white-space:nowrap}
.brand .im{
  font-size:9.5px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;
  color:var(--ink-2);
}
.viewname{
  font-family:"Bodoni Moda",Didot,Georgia,serif;font-size:19px;letter-spacing:.01em;
  margin-left:auto;color:var(--ink);
}

/* ---------- tabbar ---------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:rgba(19,17,16,.93);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-top:1px solid var(--accent-line);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.tabbar-inner{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{
  height:var(--tabh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--ink-3);font-size:10.5px;font-weight:600;letter-spacing:.02em;
}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent)}
.tab .dot{position:absolute;transform:translate(13px,-11px);width:7px;height:7px;border-radius:50%;background:var(--bad);border:1.5px solid var(--surface)}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-1)}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-sm{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grow{flex:1;min-width:0}
.eyebrow{
  font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);
}
.sec{display:flex;flex-direction:column;gap:9px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3);font-size:13px}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:11px 15px;border-radius:11px;font-weight:700;font-size:14.5px;
  background:var(--surface-2);color:var(--ink);border:1px solid var(--line);
}
.btn:active{transform:scale(.985)}
.btn-primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn-danger{background:transparent;color:var(--bad);border-color:var(--line)}
.btn-block{width:100%}
.btn-sm{padding:7px 11px;font-size:13px;border-radius:9px;font-weight:600}
.btn-ghost{background:transparent;border-color:transparent;color:var(--accent);font-weight:700}

.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;-ms-overflow-style:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;padding:7px 13px;border-radius:999px;font-size:13px;font-weight:600;
  background:var(--surface);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap;
}
.chip[aria-pressed="true"]{background:var(--accent);border-color:transparent;color:var(--accent-ink)}

.badge{
  display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:7px;
  font-size:11.5px;font-weight:700;letter-spacing:.02em;white-space:nowrap;
}
.b-good{background:var(--good-soft);color:var(--good)}
.b-warn{background:var(--warn-soft);color:var(--warn)}
.b-bad{background:var(--bad-soft);color:var(--bad)}
.b-neutral{background:var(--surface-2);color:var(--ink-2)}
.b-accent{background:var(--accent-soft);color:var(--accent)}

.empty{
  text-align:center;padding:34px 20px;color:var(--ink-3);
  border:1px dashed var(--line-2);border-radius:var(--r);font-size:14px;
}
.empty strong{display:block;color:var(--ink-2);font-size:15px;margin-bottom:4px}

/* ---------- hero ---------- */
.hero{
  position:relative;color:var(--ink);border-radius:var(--r);padding:19px;
  background:linear-gradient(158deg,#1A150D 0%,#0C0A07 62%);
  border:1px solid var(--accent-line);box-shadow:var(--shadow-2);
}
.hero::after{ /* anel interno, o fio dourado do logo */
  content:"";position:absolute;inset:5px;border-radius:calc(var(--r) - 5px);
  border:1px solid rgba(216,174,88,.2);pointer-events:none;
}
.hero .eyebrow{color:var(--gold);opacity:1}
.hero-value{
  font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;
  font-size:clamp(30px,9vw,38px);font-weight:600;line-height:1.05;letter-spacing:-.02em;margin-top:6px;
  color:var(--gold);
  background:linear-gradient(178deg,var(--gold-2) 0%,var(--gold) 52%,var(--gold-3) 100%);
  -webkit-background-clip:text;background-clip:text;
}
@supports ((-webkit-background-clip:text) or (background-clip:text)){
  .hero-value{-webkit-text-fill-color:transparent}
}
.hero-split{display:flex;gap:0;margin-top:15px;border-top:1px solid rgba(216,174,88,.18);padding-top:13px}
.hero-split>div{flex:1;min-width:0}
.hero-split>div+div{border-left:1px solid rgba(216,174,88,.18);padding-left:14px}
.hero-split .k{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.hero-split .v{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:17px;font-weight:600;margin-top:2px;color:var(--ink)}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 13px}
.tile .k{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.tile .v{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:19px;font-weight:600;margin-top:5px;letter-spacing:-.01em}
.tile .s{font-size:12px;color:var(--ink-3);margin-top:2px}

/* ---------- list rows ---------- */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{
  display:flex;align-items:center;gap:11px;padding:12px 13px;text-align:left;width:100%;
  border-bottom:1px solid var(--line);background:var(--surface);
}
.item:last-child{border-bottom:0}
.item:active{background:var(--surface-2)}
.item-main{flex:1;min-width:0}
.item-t{font-weight:700;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-s{font-size:12.5px;color:var(--ink-3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-r{text-align:right;flex:0 0 auto}
.item-v{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-weight:600;font-size:14.5px}
.chev{flex:0 0 auto;width:16px;height:16px;stroke:var(--ink-3);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.mrk{flex:0 0 auto;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
  font-family:"Bodoni Moda",Didot,serif;font-size:14px;color:var(--accent);background:var(--accent-soft)}

.group-label{
  display:flex;align-items:center;gap:9px;margin:16px 0 7px;
  font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);
}
.group-label::after{content:"";flex:1;height:1px;background:var(--line)}

/* payable row with checkbox */
.pay{display:flex;align-items:center;gap:11px;padding:11px 13px;border-bottom:1px solid var(--line)}
.pay:last-child{border-bottom:0}
.tick{
  flex:0 0 auto;width:26px;height:26px;border-radius:8px;border:1.8px solid var(--line-2);
  display:grid;place-items:center;background:var(--surface);
}
.tick svg{width:15px;height:15px;stroke:var(--accent-ink);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.tick[aria-pressed="true"]{background:var(--good);border-color:var(--good)}
.tick[aria-pressed="true"] svg{opacity:1;stroke:#fff}
.pay.done .pay-t{text-decoration:line-through;color:var(--ink-3)}
.wa{flex:0 0 auto;width:32px;height:32px;border-radius:9px;background:var(--good-soft);display:grid;place-items:center}
.wa svg{width:17px;height:17px;fill:var(--good)}

/* ---------- chart ---------- */
.chart{padding:14px 13px 10px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.bar{fill:var(--accent);opacity:.85;transition:opacity .12s}
.bar-hit{fill:transparent;cursor:pointer}
.bar-g:hover .bar,.bar-g.on .bar{opacity:1}
.bar-g.on .bar{fill:var(--accent)}
.bar-empty{fill:var(--line)}
.axl{fill:var(--ink-3);font-size:10px;font-family:"IBM Plex Mono",monospace;font-weight:500}
.baseline{stroke:var(--line);stroke-width:1}
.tipbox{
  margin-top:8px;padding:8px 11px;border-radius:9px;background:var(--surface-2);
  display:flex;justify-content:space-between;gap:10px;font-size:12.5px;min-height:34px;align-items:center;
}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(24,16,26,.44);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:61;
  background:var(--bg);border-radius:20px 20px 0 0;
  max-height:92vh;display:flex;flex-direction:column;
  transform:translateY(102%);transition:transform .26s cubic-bezier(.32,.72,0,1);
  box-shadow:0 -8px 40px -12px rgba(24,16,26,.5);
}
.sheet.open{transform:translateY(0)}
.sheet-inner{max-width:600px;margin:0 auto;width:100%;display:flex;flex-direction:column;min-height:0}
.sheet-head{
  display:flex;align-items:center;gap:12px;padding:14px 16px 12px;border-bottom:1px solid var(--line);
}
.sheet-title{font-family:"Bodoni Moda",Didot,Georgia,serif;font-size:18px;flex:1;min-width:0}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px;display:flex;flex-direction:column;gap:14px}
.sheet-foot{
  padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));
  border-top:1px solid var(--line);background:var(--surface);display:flex;gap:9px;
}
.xbtn{width:32px;height:32px;border-radius:9px;background:var(--surface-2);display:grid;place-items:center;flex:0 0 auto}
.xbtn svg{width:16px;height:16px;stroke:var(--ink-2);fill:none;stroke-width:2.2;stroke-linecap:round}

/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:6px}
.field>label{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--ink-2)}
.field .hint{font-size:11.5px;color:var(--ink-3)}
input[type=text],input[type=date],input[type=tel],input[type=number],select,textarea{
  width:100%;padding:11px 12px;border-radius:11px;border:1px solid var(--line-2);
  background:var(--surface);font-size:16px;/* 16px evita zoom no iOS */
  appearance:none;-webkit-appearance:none;
}
select{background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:36px}
textarea{min-height:64px;resize:vertical;line-height:1.4}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field-3{display:grid;grid-template-columns:.72fr 1fr 1fr;gap:7px}
.field-3 input{padding:11px 9px}
.margem{font-size:11.5px;color:var(--ink-3);line-height:1.4}
.margem .ok{color:var(--good);font-weight:700}
.margem .ruim{color:var(--bad);font-weight:700}

.toggle{display:flex;align-items:flex-start;gap:11px;padding:12px;border-radius:12px;
  background:var(--surface);border:1px solid var(--line-2);text-align:left;width:100%}
.toggle b{display:block;font-size:14px;margin-bottom:2px}
.toggle .hint{display:block}
.toggle-box{flex:0 0 auto;width:24px;height:24px;border-radius:7px;border:1.8px solid var(--line-2);
  display:grid;place-items:center;background:var(--surface);margin-top:1px}
.toggle-box svg{width:14px;height:14px;fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.toggle[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.toggle[aria-pressed="true"] .toggle-box{background:var(--accent);border-color:var(--accent)}
.toggle[aria-pressed="true"] .toggle-box svg{opacity:1;stroke:var(--accent-ink)}

.mes-head{display:flex;flex-direction:column;gap:7px;padding:13px;
  background:var(--surface-2);border:1px solid var(--line);border-bottom:0;
  border-radius:var(--r) var(--r) 0 0}
.mes-nome{font-family:"Bodoni Moda",Didot,Georgia,serif;font-size:16.5px}
.mes-nums{display:flex;flex-wrap:wrap;gap:3px 15px;font-size:11.5px;color:var(--ink-3)}
.mes-nums b{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;
  color:var(--ink);font-weight:600;font-size:12.5px}
.hist-grupo .list{border-radius:0 0 var(--r) var(--r)}
.mrk.compra{background:var(--gold-soft);color:var(--gold)}

a.btn{text-decoration:none}
.oc{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;
  letter-spacing:.04em;color:var(--gold)}
.ficha{display:flex;flex-direction:column;gap:6px;padding:11px 12px;border-radius:11px;
  background:var(--accent-soft);border:1px solid var(--accent-line)}
.ficha-nums{display:flex;flex-wrap:wrap;gap:3px 14px;font-size:12px;color:var(--ink-2)}
.ficha-nums b{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;color:var(--ink)}
.ficha-nums .dev{color:var(--bad);font-weight:700}
.tel{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.req{margin-left:6px;font-size:9.5px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--gold)}
input.erro{border-color:var(--bad);box-shadow:0 0 0 3px var(--bad-soft)}
.note.urgente{background:var(--bad-soft);border-color:rgba(228,112,124,.34);align-items:center}

/* Confirmacao propria: o confirm() do navegador nao aparece em app instalado. */
.dlg{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:22px;
  background:rgba(6,5,4,.66);opacity:0;pointer-events:none;transition:opacity .18s}
.dlg.open{opacity:1;pointer-events:auto}
.dlg-caixa{width:100%;max-width:340px;background:var(--surface);border:1px solid var(--line-2);
  border-radius:16px;padding:18px;box-shadow:var(--shadow-2);
  transform:scale(.96);transition:transform .18s}
.dlg.open .dlg-caixa{transform:scale(1)}
.dlg-titulo{font-family:"Bodoni Moda",Didot,Georgia,serif;font-size:19px;margin-bottom:8px}
.dlg-texto{margin:0 0 16px;font-size:14px;line-height:1.5;color:var(--ink-2)}
.dlg-botoes{display:flex;gap:9px}
.dlg-botoes .btn{flex:1}
.dlg-botoes .btn-danger{background:var(--bad-soft);border-color:rgba(228,112,124,.42)}
.note .btn{flex:0 0 auto}
.money-in{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:0;background:var(--surface-2);border-radius:11px;padding:3px;border:1px solid var(--line)}
.seg button{padding:9px 6px;border-radius:9px;font-size:13.5px;font-weight:700;color:var(--ink-2);text-align:center}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:var(--shadow-1)}

.itemrow{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px;display:flex;flex-direction:column;gap:8px}
.itemrow-head{display:flex;align-items:center;gap:8px}
.del{width:28px;height:28px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;flex:0 0 auto}
.del svg{width:14px;height:14px;stroke:var(--bad);fill:none;stroke-width:2.2;stroke-linecap:round}

.totalbar{
  display:flex;justify-content:space-between;align-items:baseline;padding:13px;border-radius:12px;
  background:var(--accent-soft);border:1px solid var(--accent-line);
}
.totalbar .v{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:22px;font-weight:600;color:var(--accent)}

.preview{background:var(--surface-2);border-radius:11px;padding:11px 12px;display:flex;flex-direction:column;gap:6px}
.preview .p{display:flex;justify-content:space-between;font-size:13px}
.preview .p .d{color:var(--ink-3)}

.note{
  display:flex;gap:9px;padding:11px 12px;border-radius:11px;background:var(--gold-soft);
  border:1px solid color-mix(in srgb,var(--gold) 30%,transparent);font-size:13px;color:var(--ink-2);line-height:1.4;
}
.note b{color:var(--ink)}

.toast{
  position:fixed;left:50%;bottom:calc(var(--tabh) + 22px + env(safe-area-inset-bottom,0px));z-index:80;
  transform:translate(-50%,14px);background:var(--ink);color:var(--bg);
  padding:11px 17px;border-radius:11px;font-size:13.5px;font-weight:600;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:88vw;text-align:center;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

.fab{
  position:fixed;right:max(14px,calc(50vw - 286px));z-index:45;
  bottom:calc(var(--tabh) + 16px + env(safe-area-inset-bottom,0px));
  height:50px;padding:0 20px;border-radius:25px;background:var(--accent);color:var(--accent-ink);
  font-weight:800;font-size:15px;box-shadow:var(--shadow-2);display:inline-flex;align-items:center;gap:8px;
}
.fab svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round}

.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--ink-3)}
.kv .v{font-weight:600;text-align:right}

.demo-bar{
  display:flex;align-items:center;gap:11px;padding:12px;border-radius:12px;
  background:var(--gold-soft);border:1px solid rgba(216,174,88,.45);
  font-size:12.5px;color:var(--ink-2);line-height:1.45;
}
.demo-bar b{color:var(--gold)}
.demo-bar .btn{flex:0 0 auto}

@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}

<script>
(function(){
"use strict";

/* =======================================================================
   1. UTILIDADES
   ======================================================================= */

const $ = (s, r) => (r || document).querySelector(s);
const money = new Intl.NumberFormat("pt-BR", { style:"currency", currency:"BRL" });
const moneyShort = new Intl.NumberFormat("pt-BR", { minimumFractionDigits:2, maximumFractionDigits:2 });
const R$ = v => money.format(Number(v) || 0);

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function r2(n){ return Math.round((Number(n) || 0) * 100) / 100; }
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

/* "1.234,56" / "1234,56" / "1234.56" -> 1234.56 */
function parseMoney(str){
  if (typeof str === "number") return str;
  let s = String(str || "").replace(/[^\d,.-]/g,"");
  if (!s) return 0;
  const hasC = s.includes(","), hasD = s.includes(".");
  if (hasC && hasD) s = s.replace(/\./g,"").replace(",",".");
  else if (hasC) s = s.replace(",",".");
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}

const MESES = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const MESES_LONG = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];

function hoje(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function parseISO(iso){
  const p = String(iso || "").split("-");
  return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
}
function fmtData(iso){
  if (!iso) return "—";
  const p = String(iso).split("-");
  return p[2] + "/" + p[1] + "/" + p[0].slice(2);
}
function fmtDataCurta(iso){
  if (!iso) return "—";
  const p = String(iso).split("-");
  return p[2] + " " + MESES[Number(p[1]) - 1];
}
function addMeses(iso, n){
  const d = parseISO(iso);
  const dia = d.getDate();
  const alvo = new Date(d.getFullYear(), d.getMonth() + n, 1);
  const ultimo = new Date(alvo.getFullYear(), alvo.getMonth() + 1, 0).getDate();
  alvo.setDate(Math.min(dia, ultimo));
  return alvo.getFullYear() + "-" + String(alvo.getMonth()+1).padStart(2,"0") + "-" + String(alvo.getDate()).padStart(2,"0");
}
const mesDe = iso => String(iso || "").slice(0,7);
function labelMes(ym){
  const p = ym.split("-");
  return MESES_LONG[Number(p[1]) - 1] + " de " + p[0];
}
function diasAte(iso){
  const a = parseISO(hoje()), b = parseISO(iso);
  return Math.round((b - a) / 86400000);
}

/* Divide um valor em N parcelas; a diferença de centavos vai na 1ª. */
function dividir(total, n){
  const cent = Math.round(r2(total) * 100);
  const base = Math.floor(cent / n);
  const sobra = cent - base * n;
  const out = [];
  for (let i = 0; i < n; i++) out.push(((i === 0 ? base + sobra : base)) / 100);
  return out;
}
function gerarParcelas(total, n, primeiraData){
  const valores = dividir(total, n);
  return valores.map((v, i) => ({
    n: i + 1, valor: v, venc: addMeses(primeiraData, i), pago: false, pagoEm: null
  }));
}

function soDigitos(s){ return String(s || "").replace(/\D/g,""); }

/* O celular e a identidade do cliente: ninguem aqui quer informar CPF.
   Guardamos so os digitos, sem o 55, para o mesmo numero nunca virar duas fichas. */
function normTel(t){
  let d = soDigitos(t);
  if (d.length > 11 && d.slice(0,2) === "55") d = d.slice(2);
  return d.slice(-11);
}
function fmtTel(t){
  const d = normTel(t);
  if (d.length === 11) return "(" + d.slice(0,2) + ") " + d.slice(2,7) + "-" + d.slice(7);
  if (d.length === 10) return "(" + d.slice(0,2) + ") " + d.slice(2,6) + "-" + d.slice(6);
  return d;
}
function linkWhats(tel, texto){
  let d = normTel(tel);
  if (!d) return null;
  if (d.length === 10 || d.length === 11) d = "55" + d;
  return "https://wa.me/" + d + "?text=" + encodeURIComponent(texto);
}

let toastT;
function toast(msg){
  const el = $("#toast");
  el.textContent = msg;
  el.classList.add("on");
  clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove("on"), 2200);
}

let storageOk = true;
function testarStorage(){
  try {
    const k = "__mf_teste__";
    localStorage.setItem(k, "ok");
    storageOk = localStorage.getItem(k) === "ok";
    localStorage.removeItem(k);
  } catch (e) { storageOk = false; }
}
function lerCfg(){
  try {
    const o = JSON.parse(localStorage.getItem(CFG_KEY) || "null");
    if (o && typeof o === "object") Object.assign(cfg, o);
  } catch (e) {}
}
function gravarCfg(){
  try { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); } catch (e) {}
}
function marcarBackup(){ cfg.ultimoBackup = hoje(); gravarCfg(); render(); }

const S = { produtos:[], clientes:[], fornecedores:[], compras:[], vendas:[] };

let dbRef = null;                 /* namespace db, quando disponível */
let dbStatus = "local";           /* local | nuvem */
const semeado = {};               /* controla o envio inicial local -> nuvem */

function lerLocal(){
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return;
    const o = JSON.parse(raw);
    COLS.forEach(c => { if (Array.isArray(o[c])) S[c] = o[c]; });
  } catch (e) { /* aparelho sem storage: segue em memória */ }
}
function gravarLocal(semCopia){
  /* Antes da primeira gravacao do dia, guarda como tudo estava. E o que permite
     desfazer uma importacao errada ou uma exclusao sem querer. */
  if (!semCopia) {
    try {
      const atual = localStorage.getItem(LS_KEY);
      let snap = null;
      try { snap = JSON.parse(localStorage.getItem(SNAP_KEY) || "null"); } catch (e) {}
      if (atual && (!snap || snap.data !== hoje())) {
        localStorage.setItem(SNAP_KEY, JSON.stringify({ data: hoje(), dados: JSON.parse(atual) }));
      }
    } catch (e) {
      /* sem espaco para a copia: descarta a copia, nunca o dado principal */
      try { localStorage.removeItem(SNAP_KEY); } catch (e2) {}
    }
  }
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {}
}

function salvar(col, obj){
  const i = S[col].findIndex(x => x.id === obj.id);
  if (i < 0) S[col].push(obj); else S[col][i] = obj;
  gravarLocal();
  if (dbRef) dbRef.collection(col).doc(obj.id).set(obj).catch(erroDb);
  render();
}
function apagar(col, id){
  S[col] = S[col].filter(x => x.id !== id);
  gravarLocal();
  if (dbRef) dbRef.collection(col).doc(id).delete().catch(erroDb);
  render();
}
function erroDb(e){
  const c = e && e.code;
  if (c === "quota_exceeded") toast("Limite de registros na nuvem cheio.");
  else if (c === "revoked" || c === "not_granted") { dbRef = null; dbStatus = "local"; render(); }
  else if (c === "invalid_argument") toast("Não consegui salvar na nuvem.");
}

async function iniciarNuvem(){
  let db = null;
  try { db = await window.claude.use("db"); } catch (e) { db = null; }
  if (!db) { dbStatus = "local"; render(); return; }
  dbRef = db; dbStatus = "nuvem";
  COLS.forEach(col => {
    db.collection(col).onSnapshot(snap => {
      const remoto = snap.docs.map(d => Object.assign({}, d.data(), { id: d.id }));
      if (!semeado[col]) {
        semeado[col] = true;
        if (remoto.length === 0 && S[col].length > 0) {
          S[col].forEach(o => db.collection(col).doc(o.id).set(o).catch(erroDb));
          return;
        }
      }
      S[col] = remoto;
      gravarLocal();
      if (col === "vendas") numerarVendasAntigas();
      render();
    }, err => {
      if (err && (err.code === "revoked" || err.code === "not_granted" || err.code === "capability_disabled")) {
        dbRef = null; dbStatus = "local"; render();
      }
    });
  });
  render();
}

const FORMAS = {

  dinheiro:   { rot:"Dinheiro",         curto:"Dinh." },
  cartao:     { rot:"Cartão de crédito",curto:"Cartão"},

/* Compra parcelada: cartão ou promissória — nas duas ela paga ao longo dos meses.
   Venda: só promissória. No cartão o dinheiro cai de uma vez, salvo quando
   ela marca que a maquininha deposita mês a mês. */
function parceladoReg(tipo, forma, cartaoParc){
  if (tipo === "compra") return forma === "cartao" || forma === "promissoria";
  if (forma === "promissoria") return true;
  return forma === "cartao" && !!cartaoParc;
}
function rascParcelado(tipo){ return parceladoReg(tipo, rascunho.forma, rascunho.cartaoParc); }

function totalItens(itens, campo){
  return r2((itens || []).reduce((s, it) => s + (Number(it.qtd)||0) * (Number(it[campo])||0), 0));
}
function totalVenda(v){ return r2(totalItens(v.itens, "precoUnit") - (Number(v.desconto)||0)); }
function liquidoVenda(v){ return r2(totalVenda(v) * (1 - (Number(v.taxaPct)||0) / 100)); }
function custoItem(it){ return Number(it.custoUnit) || custoMedio(it.produtoId); }
function custoVenda(v){
  return r2((v.itens || []).reduce((s, it) => s + (Number(it.qtd)||0) * custoItem(it), 0));
}
function lucroVenda(v){ return r2(liquidoVenda(v) - custoVenda(v)); }
function totalCompra(c){ return totalItens(c.itens, "custoUnit"); }

function abertoDe(reg){ return r2((reg.parcelas||[]).filter(p => !p.pago).reduce((s,p) => s + p.valor, 0)); }
function pagasDe(reg){ return (reg.parcelas||[]).filter(p => p.pago).length; }
function quitado(reg){ return (reg.parcelas||[]).every(p => p.pago); }

function estoqueDe(pid){
  const d = D();
  let e = 0;
  d.compras.forEach(c => (c.itens||[]).forEach(it => { if (it.produtoId === pid) e += Number(it.qtd)||0; }));
  d.vendas.forEach(v => (v.itens||[]).forEach(it => { if (it.produtoId === pid) e -= Number(it.qtd)||0; }));
  return e;
}
function custoMedio(pid){
  const d = D();
  let q = 0, t = 0;
  d.compras.forEach(c => (c.itens||[]).forEach(it => {
    if (it.produtoId === pid) { q += Number(it.qtd)||0; t += (Number(it.qtd)||0) * (Number(it.custoUnit)||0); }
  }));
  if (q > 0) return r2(t / q);
  const ult = d.vendas.flatMap(v => v.itens||[]).filter(it => it.produtoId === pid).pop();
  return ult ? Number(ult.custoUnit)||0 : 0;
}

/* Achata todas as parcelas de vendas (receber) ou compras (pagar). */
function parcelasFlat(tipo){
  const d = D();
  const regs = tipo === "receber" ? d.vendas : d.compras;
  const out = [];
  regs.forEach(reg => {
    (reg.parcelas||[]).forEach((p, i) => {
      out.push({
        tipo, regId: reg.id, idx: i, n: p.n, total: reg.parcelas.length,
        valor: p.valor, venc: p.venc, pago: p.pago, pagoEm: p.pagoEm,
        quem: tipo === "receber" ? (reg.clienteNome || "Sem cliente") : (reg.fornecedorNome || "Sem fornecedor"),
        tel: tipo === "receber" ? (buscarCliente(reg.clienteId) || {}).tel : "",
        forma: reg.forma
      });
    });
  });
  out.sort((a,b) => a.venc < b.venc ? -1 : a.venc > b.venc ? 1 : 0);
  return out;
}
function buscarCliente(id){ return D().clientes.find(c => c.id === id); }
function clientePorTel(tel){
  const d = normTel(tel);
  return d ? (S.clientes.find(c => normTel(c.tel) === d) || null) : null;
}

/* Cada venda vira uma Ordem de Compra numerada, para ela e o cliente poderem
   se referir a mesma compra depois. O numero sai do maior ja usado. */
function proximaOC(){
  let maior = 0;
  S.vendas.forEach(v => {
    const m = /^OC-(\d+)$/.exec(v.oc || "");
    if (m) maior = Math.max(maior, parseInt(m[1], 10));
  });
  return "OC-" + String(maior + 1).padStart(4, "0");
}
/* Vendas anteriores a numeracao ganham OC em ordem de data. Roda uma vez:
   depois disso todas tem numero e a funcao nao escreve mais nada. */
function numerarVendasAntigas(){
  const sem = S.vendas.filter(v => !v.oc);
  if (!sem.length) return;
  let maior = 0;
  S.vendas.forEach(v => {
    const m = /^OC-(\d+)$/.exec(v.oc || "");
    if (m) maior = Math.max(maior, parseInt(m[1], 10));
  });
  sem.sort((a,b) => a.data.localeCompare(b.data) || a.id.localeCompare(b.id));
  sem.forEach(v => { maior++; v.oc = "OC-" + String(maior).padStart(4,"0"); salvarSilencioso("vendas", v); });
}

/* Tudo que essa pessoa ja comprou na loja, agrupado pelo celular dela. */
function statsCliente(id){
  const vs = D().vendas.filter(v => v.clienteId === id).sort((a,b) => a.data.localeCompare(b.data));
  const total = r2(vs.reduce((a,v) => a + totalVenda(v), 0));
  return {
    vendas: vs, n: vs.length, total: total,
    aberto: r2(vs.reduce((a,v) => a + abertoDe(v), 0)),
    ticket: vs.length ? r2(total / vs.length) : 0,
    primeira: vs.length ? vs[0].data : null,
    ultima: vs.length ? vs[vs.length - 1].data : null
  };
}

function statusParcela(p){
  if (p.pago) return { cls:"b-good", txt:"Paga" };
  const d = diasAte(p.venc);
  if (d < 0)  return { cls:"b-bad",  txt: (-d) + (d === -1 ? " dia atrás" : " dias atrás") };
  if (d === 0) return { cls:"b-warn", txt:"Vence hoje" };
  if (d <= 7)  return { cls:"b-warn", txt:"Em " + d + (d === 1 ? " dia" : " dias") };
  return { cls:"b-neutral", txt:"Em " + d + " dias" };
}

function resumo(){
  const d = D(), mes = mesDe(hoje());
  const rec = parcelasFlat("receber").filter(p => !p.pago);
  const pag = parcelasFlat("pagar").filter(p => !p.pago);
  const vendasMes = d.vendas.filter(v => mesDe(v.data) === mes);
  return {
    aReceber: r2(rec.reduce((s,p) => s + p.valor, 0)),
    vencidas: rec.filter(p => diasAte(p.venc) < 0),
    aPagar:   r2(pag.reduce((s,p) => s + p.valor, 0)),
    pagarVencidas: pag.filter(p => diasAte(p.venc) < 0).length,
    faturaMes: r2(vendasMes.reduce((s,v) => s + totalVenda(v), 0)),
    lucroMes:  r2(vendasMes.reduce((s,v) => s + lucroVenda(v), 0)),
    qtdVendasMes: vendasMes.length,
    pecas: d.produtos.reduce((s,p) => s + Math.max(0, estoqueDe(p.id)), 0),
    semEstoque: d.produtos.filter(p => estoqueDe(p.id) <= 0).length,
    proximas: parcelasFlat("receber").filter(p => !p.pago).slice(0,5)
  };
}

/* Últimos 6 meses de faturamento, para o gráfico. */
function seriesMeses(){
  const d = D(), out = [];
  const base = parseISO(hoje());
  for (let i = 5; i >= 0; i--) {
    const dt = new Date(base.getFullYear(), base.getMonth() - i, 1);
    const ym = dt.getFullYear() + "-" + String(dt.getMonth()+1).padStart(2,"0");
    const vs = d.vendas.filter(v => mesDe(v.data) === ym);
    out.push({
      ym, rot: MESES[dt.getMonth()],
      valor: r2(vs.reduce((s,v) => s + totalVenda(v), 0)),
      lucro: r2(vs.reduce((s,v) => s + lucroVenda(v), 0)),
      qtd: vs.length
    });
  }
  return out;
}

/* Pergunta de sim ou nao desenhada na pagina. Devolve uma promessa porque o
   confirm() nativo nao e confiavel em app instalado na tela de inicio do iPhone:
   ele simplesmente nao aparece, e todo botao de excluir virava um toque morto. */
let resolverDialogo = null;
function perguntar(titulo, texto, rotuloOk){
  return new Promise(resolve => {
    if (resolverDialogo) { const r = resolverDialogo; resolverDialogo = null; r(false); }
    resolverDialogo = resolve;
    $("#dlgTitulo").textContent = titulo;
    $("#dlgTexto").textContent = texto;
    $("#dlgOk").textContent = rotuloOk || "Confirmar";
    $("#dialogo").classList.add("open");
    $("#dlgOk").focus();
  });
}
function responderDialogo(valor){
  if (!$("#dialogo").classList.contains("open")) return;
  $("#dialogo").classList.remove("open");
  const r = resolverDialogo;
  resolverDialogo = null;
  if (r) r(valor);
}
$("#dlgOk").addEventListener("click", () => responderDialogo(true));
$("#dlgCancelar").addEventListener("click", () => responderDialogo(false));
$("#dialogo").addEventListener("click", e => {
  if (e.target === $("#dialogo")) responderDialogo(false);
});

function abrirSheet(titulo, corpoHTML, botoes){
  $("#sheetTitle").textContent = titulo;
  /* Troca o corpo por um clone vazio: cada tela liga os proprios ouvintes, e sem
     isso os da tela anterior continuavam vivos e brigavam pelo mesmo clique. */
  const antigo = $("#sheetBody");
  const limpo = antigo.cloneNode(false);
  antigo.replaceWith(limpo);
  limpo.innerHTML = corpoHTML;
  $("#sheetFoot").innerHTML = botoes || "";
  $("#sheet").classList.add("open");
  $("#scrim").classList.add("open");
  document.body.style.overflow = "hidden";
}
function fecharSheet(){
  $("#sheet").classList.remove("open");
  $("#scrim").classList.remove("open");
  document.body.style.overflow = "";
  sheetSalvar = null;
  setTimeout(() => { if (!$("#sheet").classList.contains("open")) $("#sheetBody").innerHTML = ""; }, 300);
}
$("#scrim").addEventListener("click", fecharSheet);
$("#sheetClose").addEventListener("click", fecharSheet);

  $("#dl-clientes").innerHTML = S.clientes.map(c => '<option value="' + esc(c.nome) + '">').join("");

/* Acha ou cria produto/cliente/fornecedor pelo nome digitado. */
/* O celular manda. So cai no nome quando ela nao informou telefone algum,
   para nao quebrar o que ja estava cadastrado antes dessa mudanca. */
function acharOuCriarCliente(tel, nome){
  const d = normTel(tel);
  const rot = String(nome || "").trim();
  let c = d ? clientePorTel(d) : null;
  if (!c && !d && rot) {
    c = S.clientes.find(x => x.nome.toLowerCase() === rot.toLowerCase()) || null;
  }
  if (c) {
    let mudou = false;
    if (d && normTel(c.tel) !== d) { c.tel = d; mudou = true; }
    /* So completa o nome quando ainda nao havia um de verdade: um apelido
       digitado as pressas numa venda nao pode apagar o nome ja cadastrado.
       Para corrigir de fato, ela edita a ficha do cliente. */
    const semNome = !c.nome || c.nome === fmtTel(c.tel) || c.nome === fmtTel(d);
    if (rot && semNome && c.nome !== rot) { c.nome = rot; mudou = true; }
    if (mudou) salvarSilencioso("clientes", c);
    return c;
  }
  if (!d && !rot) return null;
  const novo = { id: uid(), nome: rot || fmtTel(d), tel: d, obs:"", criadoEm: hoje() };
  S.clientes.push(novo);
  gravarLocal();
  if (dbRef) dbRef.collection("clientes").doc(novo.id).set(novo).catch(erroDb);
  return novo;
}

function acharOuCriar(col, nome, extra){
  const alvo = String(nome || "").trim();
  if (!alvo) return null;
  const achado = S[col].find(x => x.nome.toLowerCase() === alvo.toLowerCase());
  if (achado) return achado;
  const novo = Object.assign({ id: uid(), nome: alvo }, extra || {});
  S[col].push(novo);
  gravarLocal();
  if (dbRef) dbRef.collection(col).doc(novo.id).set(novo).catch(erroDb);
  return novo;
}

}

/* Na compra ela já diz por quanto quer revender: o preço fica salvo no perfume
   e volta preenchido na venda, sem precisar cadastrar nada de novo. */
function margemHTML(it){
  const custo = parseMoney(it.custoUnit), preco = parseMoney(it.precoVenda);
  if (custo > 0 && preco > custo) {
    return '<span class="ok">Lucro de ' + R$(r2(preco - custo)) + ' por unidade</span> &middot; ' +
      Math.round((preco - custo) / preco * 100) + '% de margem';
  }
  if (custo > 0 && preco > 0) return '<span class="ruim">Esse preço está abaixo do custo.</span>';
  return "Por quanto você quer revender. Fica salvo e já vem preenchido na venda.";
}

function subtotalRascunho(tipo){
  const campo = tipo === "venda" ? "precoUnit" : "custoUnit";
  return r2(rascunho.itens.reduce((s, it) =>
    s + (parseMoney(it.qtd) || 0) * parseMoney(it[campo]), 0));
}
function totalRascunho(tipo){
  const sub = subtotalRascunho(tipo);
  return tipo === "venda" ? r2(sub - parseMoney(rascunho.desconto)) : sub;
}

function htmlPrevia(tipo){
  const total = totalRascunho(tipo);
  if (!rascParcelado(tipo)) {
    return '<div class="preview"><div class="p"><span class="d">' +
      (tipo === "venda" ? "Recebimento à vista" : "Pagamento à vista") + '</span>' +
      '<span class="mono">' + R$(total) + '</span></div></div>';
  }
  const n = Math.max(1, Math.min(24, parseInt(rascunho.nParc,10) || 1));
  const ps = gerarParcelas(total, n, rascunho.primeira || hoje());
  const taxa = tipo === "venda" && rascunho.forma === "cartao" ? parseMoney(rascunho.taxaPct) : 0;
  return '<div class="preview">' +
    ps.map(p => '<div class="p"><span class="d">' + p.n + '/' + n + ' &middot; ' + fmtData(p.venc) + '</span>' +
      '<span class="mono">' + R$(p.valor) + '</span></div>').join("") +
    (taxa > 0
      ? '<div class="p" style="border-top:1px solid var(--line);padding-top:6px;margin-top:2px">' +
        '<span class="d">Você recebe (menos ' + taxa + '% de taxa)</span>' +
        '<span class="mono">' + R$(r2(total * (1 - taxa/100))) + '</span></div>'
      : "") +
    '</div>';
}

function htmlPagamento(tipo){
  const f = rascunho.forma;

    '<div class="seg" data-seg="forma">' +
      Object.keys(FORMAS).map(k =>
        '<button type="button" data-v="' + k + '"' + (f === k ? ' aria-pressed="true"' : ' aria-pressed="false"') + '>' +
        FORMAS[k].curto + '</button>').join("") +
    '</div></div>';

  if (tipo === "venda" && f === "cartao") {
    h += '<button type="button" class="toggle" data-toggle="cartaoParc" aria-pressed="' +
        (rascunho.cartaoParc ? "true" : "false") + '">' +
      '<span class="toggle-box">' + ICON.check + '</span>' +
      '<span class="grow"><b>A maquininha deposita parcelado</b>' +
      '<span class="hint">Marque só nesse caso. No normal o dinheiro cai de uma vez e a venda já entra como recebida.</span></span>' +
    '</button>';
  }

  if (rascParcelado(tipo)) {
    h += '<div class="field-2">' +
      '<div class="field"><label>Parcelas</label>' +
        '<select data-f="nParc">' +
        Array.from({length:24}, (_,i) => i+1).map(n =>
          '<option value="' + n + '"' + (Number(rascunho.nParc) === n ? " selected" : "") + '>' + n + 'x</option>').join("") +
        '</select></div>' +
      '<div class="field"><label>1&ordm; vencimento</label>' +
        '<input type="date" data-f="primeira" value="' + esc(rascunho.primeira) + '"></div>' +
    '</div>';
  }

  if (tipo === "venda" && f === "cartao") {
    h += '<div class="field"><label>Taxa da maquininha (%)</label>' +
      '<input type="text" inputmode="decimal" class="money-in" data-f="taxaPct" placeholder="0" value="' + esc(rascunho.taxaPct) + '">' +
      '<span class="hint">Opcional. Desconta do lucro o que a maquininha fica.</span></div>';
  }
  return h;
}

function ligarForm(tipo){
  const body = $("#sheetBody");

  function lerCampos(){
    body.querySelectorAll("[data-f]").forEach(el => {
      const linha = el.closest("[data-i]");
      if (linha) rascunho.itens[Number(linha.dataset.i)][el.dataset.f] = el.value;
      else rascunho[el.dataset.f] = el.value;
    });
  }
  function atualizarTotais(){
    const t = $("#totalOut", body);
    if (t) t.textContent = R$(totalRascunho(tipo));
    const pv = $("#previa", body);
    if (pv) pv.innerHTML = htmlPrevia(tipo);
    if (tipo === "compra") {
      body.querySelectorAll("#itens [data-i]").forEach(el => {
        const it = rascunho.itens[Number(el.dataset.i)];
        const alvo = el.querySelector(".margem");
        if (it && alvo) alvo.innerHTML = margemHTML(it);
      });
    }
    if (tipo === "venda") {
      const ficha = $("#fichaCli", body);
      const c = clientePorTel(rascunho.clienteTel);
      if (ficha) {
        if (c) {
          const st = statsCliente(c.id);
          ficha.innerHTML = '<div class="ficha">' +
            '<span class="badge b-accent">J\u00e1 \u00e9 cliente \u2014 ' + esc(c.nome) + '</span>' +
            '<div class="ficha-nums">' +
              '<span>' + st.n + (st.n === 1 ? " compra" : " compras") + '</span>' +
              '<span><b>' + R$(st.total) + '</b> no total</span>' +
              (st.aberto > 0 ? '<span class="dev">deve ' + R$(st.aberto) + '</span>'
                             : '<span>sem pend\u00eancia</span>') +
            '</div></div>';
          const campoNome = body.querySelector('[data-f="clienteNome"]');
          if (campoNome && !campoNome.value.trim()) {
            campoNome.value = c.nome;
            rascunho.clienteNome = c.nome;
          }
        } else ficha.innerHTML = "";
      }
    }
  }
  function redesenharPgto(){
    lerCampos();
    $("#pgto", body).innerHTML = htmlPagamento(tipo);
    atualizarTotais();
  }

  body.addEventListener("input", e => {
    if (!e.target.matches("[data-f]")) return;
    e.target.classList.remove("erro");
    lerCampos();
    atualizarTotais();
  });
  body.addEventListener("change", e => {
    if (e.target.matches('[data-f="primeira"],[data-f="nParc"],[data-f="data"]')) { lerCampos(); atualizarTotais(); }
  });
  body.addEventListener("click", e => {
    const seg = e.target.closest('[data-seg="forma"] button');
    if (seg) { lerCampos(); rascunho.forma = seg.dataset.v; redesenharPgto(); return; }
    const tg = e.target.closest("[data-toggle]");
    if (tg) { lerCampos(); rascunho.cartaoParc = !rascunho.cartaoParc; redesenharPgto(); return; }
    const add = e.target.closest("[data-add]");
    if (add) {
      lerCampos();
      rascunho.itens.push(tipo === "venda"
        ? { nome:"", qtd:1, precoUnit:"" }
        : { nome:"", qtd:1, custoUnit:"", precoVenda:"" });
      $("#itens", body).innerHTML = htmlItens(tipo);
      atualizarTotais();
      const ins = body.querySelectorAll('#itens [data-f="nome"]');
      if (ins.length) ins[ins.length - 1].focus();
      return;
    }
    const rm = e.target.closest("[data-rm]");
    if (rm) {
      lerCampos();
      rascunho.itens.splice(Number(rm.dataset.rm), 1);
      $("#itens", body).innerHTML = htmlItens(tipo);
      atualizarTotais();
      return;
    }
  });
  atualizarTotais();

  sheetSalvar = tipo === "venda" ? salvarVenda : salvarCompra;

  /* Ao escolher um perfume já cadastrado, traz os valores que ela já usou. */
  function sugerir(el){
    const linha = el.closest("[data-i]");
    if (!linha) return;
    const p = S.produtos.find(x => x.nome.toLowerCase() === el.value.trim().toLowerCase());
    if (!p) return;
    const i = Number(linha.dataset.i);
    const por = (campo, valor) => {
      const alvo = linha.querySelector('[data-f="' + campo + '"]');
      if (!alvo || alvo.value || !valor) return;
      alvo.value = moneyShort.format(valor);
      rascunho.itens[i][campo] = alvo.value;
    };
    if (tipo === "venda") por("precoUnit", Number(p.preco) || 0);
    else { por("custoUnit", custoMedio(p.id)); por("precoVenda", Number(p.preco) || 0); }
    atualizarTotais();
  }
  body.addEventListener("change", e => {
    if (e.target.matches('#itens [data-f="nome"]')) sugerir(e.target);
  });
  body.addEventListener("input", e => {
    if (e.target.matches('#itens [data-f="nome"]')) sugerir(e.target);
  });
}

function montarParcelas(total, rasc, anterior, tipo){
  if (!parceladoReg(tipo, rasc.forma, rasc.cartaoParc)) {
    const antes = anterior && anterior.length === 1 ? anterior[0] : null;
    return [{ n:1, valor:total, venc:rasc.data,
      pago: antes ? antes.pago : true,
      pagoEm: antes ? antes.pagoEm : rasc.data }];
  }
  const n = Math.max(1, Math.min(24, parseInt(rasc.nParc,10) || 1));
  const novas = gerarParcelas(total, n, rasc.primeira || hoje());
  /* Mantém o que já estava pago quando o número de parcelas não mudou. */
  if (anterior && anterior.length === n) {
    novas.forEach((p, i) => { p.pago = !!anterior[i].pago; p.pagoEm = anterior[i].pagoEm || null; });
  }
  return novas;
}

function salvarVenda(){
  const body = $("#sheetBody");
  body.querySelectorAll("[data-f]").forEach(el => {
    const linha = el.closest("[data-i]");
    if (linha) rascunho.itens[Number(linha.dataset.i)][el.dataset.f] = el.value;
    else rascunho[el.dataset.f] = el.value;
  });

  /* Sem celular a venda fica órfã: não entra no histórico de ninguém, não dá
     para cobrar nem mandar a OC. É o único campo que barra o salvamento. */
  const tel = normTel(rascunho.clienteTel);
  if (tel.length < 10) {
    toast(tel ? "Celular incompleto — falta o DDD." : "Informe o celular do cliente.");
    const campo = body.querySelector('[data-f="clienteTel"]');
    if (campo) {
      campo.classList.add("erro");
      campo.focus();
      campo.scrollIntoView({ block:"center", behavior:"smooth" });
    }
    return;
  }

  const itens = rascunho.itens
    .filter(it => String(it.nome).trim() && parseMoney(it.qtd) > 0)
    .map(it => {
      const p = acharOuCriar("produtos", it.nome, { marca:"", ml:"", preco: parseMoney(it.precoUnit) });
      return {
        produtoId: p.id, nome: p.nome,
        qtd: parseMoney(it.qtd),
        precoUnit: parseMoney(it.precoUnit),
        custoUnit: custoMedio(p.id)
      };
    });
  if (!itens.length) { toast("Adicione pelo menos um perfume."); return; }

  const cliente = acharOuCriarCliente(rascunho.clienteTel, rascunho.clienteNome);

  const anterior = rascunho.id ? (S.vendas.find(v => v.id === rascunho.id) || {}).parcelas : null;
  const venda = {
    id: rascunho.id || uid(),
    data: rascunho.data || hoje(),
    oc: rascunho.oc || proximaOC(),
    clienteId: cliente ? cliente.id : null,
    clienteNome: cliente ? cliente.nome : "Sem cliente",
    clienteTel: cliente ? cliente.tel : "",
    itens: itens,
    desconto: parseMoney(rascunho.desconto),
    taxaPct: rascunho.forma === "cartao" ? parseMoney(rascunho.taxaPct) : 0,
    forma: rascunho.forma,
    cartaoParc: rascunho.forma === "cartao" && !!rascunho.cartaoParc,
    obs: String(rascunho.obs || "").trim()
  };
  venda.total = totalVenda(venda);
  venda.parcelas = montarParcelas(venda.total, rascunho, anterior, "venda");

  salvar("vendas", venda);
  fecharSheet();
  toast(rascunho.id ? "Venda atualizada." : "Venda registrada.");
}

function salvarCompra(){
  const body = $("#sheetBody");
  body.querySelectorAll("[data-f]").forEach(el => {
    const linha = el.closest("[data-i]");
    if (linha) rascunho.itens[Number(linha.dataset.i)][el.dataset.f] = el.value;
    else rascunho[el.dataset.f] = el.value;
  });

  const itens = rascunho.itens
    .filter(it => String(it.nome).trim() && parseMoney(it.qtd) > 0)
    .map(it => {
      const preco = parseMoney(it.precoVenda);
      const p = acharOuCriar("produtos", it.nome, { marca:"", ml:"", preco: preco });
      if (preco > 0 && Number(p.preco) !== preco) { p.preco = preco; salvarSilencioso("produtos", p); }
      return {
        produtoId: p.id, nome: p.nome, qtd: parseMoney(it.qtd),
        custoUnit: parseMoney(it.custoUnit), precoVenda: preco
      };
    });
  if (!itens.length) { toast("Adicione pelo menos um perfume."); return; }

  const forn = String(rascunho.fornecedorNome).trim()
    ? acharOuCriar("fornecedores", rascunho.fornecedorNome, { tel:"" })
    : null;

  const anterior = rascunho.id ? (S.compras.find(c => c.id === rascunho.id) || {}).parcelas : null;
  const compra = {
    id: rascunho.id || uid(),
    data: rascunho.data || hoje(),
    fornecedorId: forn ? forn.id : null,
    fornecedorNome: forn ? forn.nome : "Sem fornecedor",
    itens: itens, forma: rascunho.forma,
    obs: String(rascunho.obs || "").trim()
  };
  compra.total = totalCompra(compra);
  compra.parcelas = montarParcelas(compra.total, rascunho, anterior, "compra");

  salvar("compras", compra);
  fecharSheet();
  toast(rascunho.id ? "Compra atualizada." : "Compra registrada.");
}

function salvarSilencioso(col, obj){
  const i = S[col].findIndex(x => x.id === obj.id);
  if (i < 0) S[col].push(obj); else S[col][i] = obj;
  gravarLocal();
  if (dbRef) dbRef.collection(col).doc(obj.id).set(obj).catch(erroDb);
}

/* A OC em texto, para ela mandar no WhatsApp. E o comprovante que o cliente
   leva sem precisar dar CPF nenhum. */
function textoOC(v){
  const L = [];
  L.push("*MF IMPORTS* \u2014 Perfumes \u00c1rabes Originais");
  L.push("Ordem de compra *" + (v.oc || "\u2014") + "*");
  L.push("Data: " + fmtData(v.data));
  if (v.clienteNome) L.push("Cliente: " + v.clienteNome);
  L.push("");
  v.itens.forEach(it => L.push("\u2022 " + it.qtd + " x " + it.nome + " \u2014 " + R$(it.precoUnit) + " cada"));
  if (v.desconto) L.push("Desconto: \u2212 " + R$(v.desconto));
  L.push("*Total: " + R$(totalVenda(v)) + "*");
  L.push("");
  if (v.parcelas.length > 1) {
    L.push("Pagamento: " + FORMAS[v.forma].rot + " em " + v.parcelas.length + "x");
    v.parcelas.forEach(p => L.push("   " + p.n + "/" + v.parcelas.length + " \u2014 " + R$(p.valor) +
      " at\u00e9 " + fmtData(p.venc) + (p.pago ? " (pago)" : "")));
  } else {
    L.push("Pagamento: " + FORMAS[v.forma].rot);
  }
  L.push("");
  L.push("Obrigada pela prefer\u00eancia!");
  return L.join("\n");
}

function msgCobranca(nome, p){
  const primeiro = String(nome || "").split(" ")[0];
  const venc = diasAte(p.venc) < 0

    : "vence dia " + fmtData(p.venc);
  return "Oi, " + primeiro + "! Tudo bem? 😊 Passando pra lembrar da parcela " + p.n +
    " no valor de " + R$(p.valor) + ", que " + venc + ". Qualquer coisa é só me chamar!";
}

function alternarPago(col, regId, idx){
  const reg = S[col].find(x => x.id === regId);
  if (!reg) return;
  const p = reg.parcelas[idx];
  p.pago = !p.pago;
  p.pagoEm = p.pago ? hoje() : null;
  salvar(col, reg);
  toast(p.pago ? "Parcela " + p.n + " marcada como paga." : "Parcela " + p.n + " reaberta.");
  if ($("#sheet").classList.contains("open")) {
    if (col === "vendas") detalheVenda(regId); else detalheCompra(regId);
  }
}

/* O historico completo de uma pessoa, todas as OCs que ela ja fez na loja. */

  const c = buscarCliente(id);
  const st = statsCliente(id);
  const linhaKV = (k, v, cor) => '<div class="kv"><span class="k">' + k + '</span>' +
    '<span class="v mono"' + (cor ? ' style="color:' + cor + '"' : '') + '>' + v + '</span></div>';

  const resumo = '<div class="sec"><span class="eyebrow">Resumo</span><div class="card" style="padding:13px">' +
    linhaKV("Compras", st.n) +
    linhaKV("Total comprado", R$(st.total)) +
    linhaKV("Ticket m\u00e9dio", R$(st.ticket)) +
    linhaKV("Em aberto", R$(st.aberto), st.aberto > 0 ? "var(--bad)" : "var(--good)") +
    (st.primeira ? linhaKV("Cliente desde", fmtData(st.primeira)) : "") +
    (st.ultima ? linhaKV("\u00daltima compra", fmtData(st.ultima)) : "") +
    '</div></div>';

  const cobrar = (c && c.tel && st.aberto > 0)
    ? '<a class="btn btn-block" target="_blank" rel="noopener" href="' +
      esc(linkWhats(c.tel, "Oi, " + String(c.nome).split(" ")[0] + "! Passando pra combinar o pagamento de " +
        R$(st.aberto) + " que est\u00e1 em aberto. Qualquer coisa me chama!")) +
      '">Falar no WhatsApp</a>'
    : "";

  if (!st.n) {
    return resumo + '<div class="empty" style="padding:18px">Nenhuma compra registrada ainda.</div>';
  }

  const ocs = '<div class="sec"><span class="eyebrow">Ordens de compra</span><div class="list">' +
    st.vendas.slice().reverse().map(v => {
      const ab = abertoDe(v);
      return '<button class="item" data-abrir="venda:' + v.id + '">' +
        '<div class="item-main"><div class="item-t oc">' + esc(v.oc || "\u2014") + '</div>' +
          '<div class="item-s">' + fmtData(v.data) + ' &middot; ' +
            esc(v.itens.map(i => i.qtd + " \u00d7 " + i.nome).join(", ")) + '</div></div>' +
        '<div class="item-r"><div class="item-v">' + R$(totalVenda(v)) + '</div>' +
          '<div style="margin-top:3px">' + (ab > 0
            ? '<span class="badge b-warn">falta ' + R$(ab) + '</span>'
            : '<span class="badge b-good">Quitada</span>') + '</div></div>' + ICON.chev +
      '</button>';
    }).join("") + '</div></div>';

  return resumo + cobrar + ocs;
}

function grafico(){
  const dados = seriesMeses();
  const max = Math.max.apply(null, dados.map(d => d.valor).concat([1]));
  const W = 320, H = 96, pad = 4;
  const passo = W / dados.length;
  const larg = Math.min(30, passo - 12);
  const sel = UI.barSel != null ? dados[UI.barSel] : dados[dados.length - 1];

  const barras = dados.map((d, i) => {
    const h = d.valor > 0 ? Math.max(3, (d.valor / max) * (H - pad)) : 2;
    const x = i * passo + (passo - larg) / 2;
    const y = H - h;
    const on = (UI.barSel != null ? UI.barSel : dados.length - 1) === i;
    return '<g class="bar-g' + (on ? " on" : "") + '">' +
      '<rect class="' + (d.valor > 0 ? "bar" : "bar-empty") + '" x="' + x.toFixed(1) + '" y="' + y.toFixed(1) +
        '" width="' + larg + '" height="' + h.toFixed(1) + '" rx="4"></rect>' +
      '<rect class="bar-hit" data-bar="' + i + '" x="' + (i * passo) + '" y="0" width="' + passo + '" height="' + (H + 18) + '"></rect>' +
      '<text class="axl" x="' + (i * passo + passo/2).toFixed(1) + '" y="' + (H + 14) + '" text-anchor="middle">' + d.rot + '</text>' +
    '</g>';
  }).join("");

  return '<div class="card chart">' +
    '<div class="spread" style="margin-bottom:10px"><span class="eyebrow">Faturamento por mês</span>' +
      '<span class="faint">últimos 6 meses</span></div>' +
    '<svg viewBox="0 0 ' + W + ' ' + (H + 20) + '" role="img" aria-label="Faturamento dos últimos seis meses">' +
      '<line class="baseline" x1="0" y1="' + H + '" x2="' + W + '" y2="' + H + '"></line>' + barras +
    '</svg>' +
    '<div class="tipbox"><span class="muted">' + MESES_LONG[Number(sel.ym.split("-")[1]) - 1] + '</span>' +
      '<span class="mono">' + R$(sel.valor) + '<span class="faint">' +

  const txt = d === null
    ? "Você ainda não guardou nenhuma cópia dos seus dados."

    ' Se perder o celular, perde tudo.</span>' +
    '<button class="btn btn-sm" data-goto="backup">Fazer agora</button></div>';

function telaVendas(){
  const d = D();
  const busca = UI.buscaVendas.toLowerCase();
  let vs = d.vendas.slice().sort((a,b) => b.data.localeCompare(a.data));
  if (UI.filtroVendas === "abertas") vs = vs.filter(v => !quitado(v));
  if (UI.filtroVendas === "quitadas") vs = vs.filter(v => quitado(v));
  if (busca) {
    const alvo = soDigitos(UI.buscaVendas);
    vs = vs.filter(v =>
      (v.clienteNome || "").toLowerCase().includes(busca) ||
      (v.oc || "").toLowerCase().includes(busca) ||
      (alvo && normTel(v.clienteTel || (buscarCliente(v.clienteId) || {}).tel).includes(alvo)) ||
      v.itens.some(i => i.nome.toLowerCase().includes(busca)));
  }

  const total = r2(vs.reduce((s,v) => s + totalVenda(v), 0));
  const lucro = r2(vs.reduce((s,v) => s + lucroVenda(v), 0));

  let corpo = "";
  if (!vs.length) {
    corpo = '<div class="empty"><strong>Nenhuma venda aqui</strong>' +
      (d.vendas.length ? "Tente outro filtro." : "Toque em Nova venda para registrar a primeira.") + '</div>';
  } else {
    let mesAtual = "";
    corpo = vs.map(v => {
      let cab = "";
      if (mesDe(v.data) !== mesAtual) { mesAtual = mesDe(v.data); cab = '<div class="group-label">' + labelMes(mesAtual) + '</div>'; }
      const ab = abertoDe(v);
      const st = ab > 0
        ? '<span class="badge b-warn">' + pagasDe(v) + "/" + v.parcelas.length + ' pagas</span>'
        : '<span class="badge b-good">Quitada</span>';
      return cab + '<div class="list" style="margin-bottom:-1px">' +
        '<button class="item" data-abrir="venda:' + v.id + '">' +
          '<div class="mrk">' + esc(String(v.clienteNome).trim().charAt(0).toUpperCase() || "?") + '</div>' +
          '<div class="item-main"><div class="item-t">' + esc(v.clienteNome) + '</div>' +
            '<div class="item-s"><span class="oc">' + esc(v.oc || "") + '</span>' +
              (v.oc ? ' &middot; ' : '') + fmtData(v.data) + ' &middot; ' +
              esc(v.itens.map(i => i.qtd + "× " + i.nome).join(", ")) + '</div></div>' +
          '<div class="item-r"><div class="item-v">' + R$(totalVenda(v)) + '</div>' +
            '<div style="margin-top:3px">' + st + '</div></div>' + ICON.chev +
        '</button></div>';
    }).join("");
  }

  return barraDemo() +
    '<div class="stack">' +
      '<input type="text" id="buscaVendas" placeholder="Buscar por cliente, celular, OC ou perfume" value="' + esc(UI.buscaVendas) + '">' +
      '<div class="chips">' +
        chip("todas","Todas",UI.filtroVendas) +
        chip("abertas","Em aberto",UI.filtroVendas) +
        chip("quitadas","Quitadas",UI.filtroVendas) +
      '</div>' +
      '<div class="tiles">' +
        tile("Total listado", R$(total), vs.length + (vs.length === 1 ? " venda" : " vendas")) +
        tile("Lucro listado", R$(lucro), total ? Math.round(lucro/total*100) + "% de margem" : "—") +
      '</div>' +
      corpo +
    '</div>';

  const valorEstoque = r2(ps.reduce((s,p) => s + Math.max(0, estoqueDe(p.id)) * custoMedio(p.id), 0));

            (p.ml ? ' <span class="faint">' + esc(p.ml) + 'ml</span>' : "") + '</div>' +
            '<div class="item-s">' + (p.marca ? esc(p.marca) + " &middot; " : "") +

          '<div class="item-r"><span class="badge ' + cls + '">' + e + ' un.</span></div>' + ICON.chev +

/* Extrato: compras e vendas na mesma linha do tempo, com o fechamento do mês. */
function resumoMes(ym){
  const d = D();
  const vs = d.vendas.filter(v => mesDe(v.data) === ym);
  const cs = d.compras.filter(c => mesDe(c.data) === ym);
  return {
    vendeu:  r2(vs.reduce((a,v) => a + totalVenda(v), 0)),
    lucro:   r2(vs.reduce((a,v) => a + lucroVenda(v), 0)),
    comprou: r2(cs.reduce((a,c) => a + totalCompra(c), 0))
  };
}

function linhaHist(e){
  const v = e.tipo === "venda", reg = e.reg;
  const total = v ? totalVenda(reg) : totalCompra(reg);
  const nomes = (reg.itens || []).map(i => i.qtd + " \u00d7 " + i.nome).join(", ");
  const ab = abertoDe(reg);
  const sit = ab > 0
    ? '<span class="badge b-warn">falta ' + R$(ab) + '</span>'
    : '<span class="badge b-good">' + (v ? "Recebida" : "Paga") + '</span>';
  return '<button class="item" data-abrir="' + (v ? "venda" : "compra") + ':' + reg.id + '">' +
    '<div class="mrk' + (v ? "" : " compra") + '">' + (v ? "V" : "C") + '</div>' +
    '<div class="item-main"><div class="item-t">' + esc(v ? reg.clienteNome : reg.fornecedorNome) + '</div>' +
      '<div class="item-s">' + fmtData(reg.data) + ' &middot; ' + esc(nomes) + '</div></div>' +
    '<div class="item-r"><div class="item-v"' + (v ? '' : ' style="color:var(--ink-2)"') + '>' +
      (v ? '' : '\u2212 ') + R$(total) + '</div>' +
      '<div style="margin-top:3px">' + sit + '</div></div>' + ICON.chev +
  '</button>';
}

function telaHistorico(){
  const d = D();
  const rotulos = { tudo:"Tudo", vendas:"S\u00f3 vendas", compras:"S\u00f3 compras" };
  const chips = '<div class="chips">' +
    Object.keys(rotulos).map(v =>
      '<button class="chip" data-chiph="' + v + '" aria-pressed="' +
      (UI.filtroHist === v ? "true" : "false") + '">' + rotulos[v] + '</button>').join("") +
    '</div>';

  const eventos = [];
  if (UI.filtroHist !== "compras") d.vendas.forEach(v => eventos.push({ tipo:"venda", data:v.data, reg:v }));
  if (UI.filtroHist !== "vendas")  d.compras.forEach(c => eventos.push({ tipo:"compra", data:c.data, reg:c }));
  eventos.sort((a,b) => b.data.localeCompare(a.data));

  if (!eventos.length) {
    return barraDemo() + '<div class="stack">' + chips +
      '<div class="empty"><strong>Nada registrado ainda</strong>' +
      'Aqui fica o extrato m\u00eas a m\u00eas de tudo que entrou e saiu.</div></div>';
  }

  let mesAtual = "";
  const partes = [];
  eventos.forEach(e => {
    const ym = mesDe(e.data);
    if (ym !== mesAtual) {
      if (mesAtual) partes.push("</div></div>");
      mesAtual = ym;
      const r = resumoMes(ym);
      partes.push('<div class="hist-grupo"><div class="mes-head">' +
        '<div class="mes-nome">' + labelMes(ym) + '</div>' +
        '<div class="mes-nums">' +
          '<span>Vendeu <b>' + R$(r.vendeu) + '</b></span>' +
          '<span>Lucro <b>' + R$(r.lucro) + '</b></span>' +
          '<span>Comprou <b>' + R$(r.comprou) + '</b></span>' +
        '</div></div><div class="list">');
    }
    partes.push(linhaHist(e));
  });
  partes.push("</div></div>");

  return barraDemo() + '<div class="stack">' + chips + partes.join("") + '</div>';
}

/* Ficha de um perfume: por quanto ela comprou e por quanto vendeu, das últimas vezes. */
function histProduto(pid){
  const d = D();
  const compras = [], vendas = [];
  d.compras.forEach(c => (c.itens || []).forEach(it => {
    if (it.produtoId === pid) compras.push({ data:c.data, qtd:it.qtd, valor:it.custoUnit, quem:c.fornecedorNome });
  }));
  d.vendas.forEach(v => (v.itens || []).forEach(it => {
    if (it.produtoId === pid) vendas.push({ data:v.data, qtd:it.qtd, valor:it.precoUnit, quem:v.clienteNome });
  }));

  const bloco = (titulo, arr, vazio) => {
    if (!arr.length) {
      return '<div class="sec"><span class="eyebrow">' + titulo + '</span>' +
        '<div class="empty" style="padding:16px;font-size:13px">' + vazio + '</div></div>';
    }
    arr.sort((a,b) => b.data.localeCompare(a.data));
    return '<div class="sec"><span class="eyebrow">' + titulo + '</span><div class="list">' +
      arr.slice(0,8).map(e =>
        '<div class="item"><div class="item-main"><div class="item-t">' + esc(e.quem) + '</div>' +
          '<div class="item-s">' + fmtData(e.data) + ' &middot; ' + e.qtd + ' un.</div></div>' +
          '<div class="item-r"><div class="item-v">' + R$(e.valor) + '</div>' +
          '<div class="item-s">por unidade</div></div></div>').join("") +
      '</div></div>';
  };

  return bloco("Compras deste perfume", compras, "Nenhuma compra registrada ainda.") +
         bloco("Vendas deste perfume", vendas, "Ainda n\u00e3o vendeu nenhum.");
}

function csvEsc(v){
  const s = String(v == null ? "" : v);
  return /[";\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}
function montarCSV(linhas){
  return "﻿" + linhas.map(l => l.map(csvEsc).join(";")).join("\r\n");
}
function csvVendas(){
  const linhas = [["OC","Data","Cliente","Celular","Perfumes","Qtd","Total","Custo","Lucro","Pagamento","Parcelas","Pagas","Em aberto"]];
  D().vendas.slice().sort((a,b) => a.data.localeCompare(b.data)).forEach(v => {
    linhas.push([
      v.oc || "", fmtData(v.data), v.clienteNome,
      fmtTel(v.clienteTel || (buscarCliente(v.clienteId) || {}).tel),
      v.itens.map(i => i.qtd + "x " + i.nome).join(" | "),
      v.itens.reduce((s,i) => s + i.qtd, 0),
      moneyShort.format(totalVenda(v)), moneyShort.format(custoVenda(v)), moneyShort.format(lucroVenda(v)),
      FORMAS[v.forma].rot, v.parcelas.length, pagasDe(v), moneyShort.format(abertoDe(v))
    ]);
  });
  return montarCSV(linhas);
}
function csvParcelas(){
  const linhas = [["Tipo","Pessoa","Parcela","Vencimento","Valor","Situação","Pago em"]];
  ["receber","pagar"].forEach(t => parcelasFlat(t).forEach(p => {
    linhas.push([
      t === "receber" ? "A receber" : "A pagar", p.quem, p.n + "/" + p.total,
      fmtData(p.venc), moneyShort.format(p.valor),
      p.pago ? "Paga" : (diasAte(p.venc) < 0 ? "Vencida" : "Em aberto"),
      p.pagoEm ? fmtData(p.pagoEm) : ""
    ]);
  }));
  return montarCSV(linhas);
}

async function exportar(tipo){
  const marca = hoje();
  let nome, conteudo;
  if (tipo === "json") {
    nome = "mf-imports-backup-" + marca + ".json";
    conteudo = JSON.stringify({ versao:1, exportadoEm:new Date().toISOString(), dados:S }, null, 2);
  } else if (tipo === "csv") {
    nome = "mf-imports-vendas-" + marca + ".csv"; conteudo = csvVendas();
  } else {
    nome = "mf-imports-parcelas-" + marca + ".csv"; conteudo = csvParcelas();
  }

  try {
    const mime = tipo === "json" ? "application/json" : "text/csv;charset=utf-8";
    const url = URL.createObjectURL(new Blob([conteudo], { type: mime }));
    const a = document.createElement("a");
    a.href = url; a.download = nome; a.rel = "noopener"; a.style.display = "none";
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 5000);
    if (tipo === "json") marcarBackup();
    toast("Arquivo gerado. Procure em Downloads / Arquivos.");
  } catch (e) {
    mostrarTexto(nome, conteudo);
  }
}

function mostrarTexto(nome, conteudo){
  abrirSheet(nome,
    '<p class="faint">Não consegui baixar o arquivo por aqui. Selecione o texto abaixo, copie e cole num arquivo ou envie para você mesma.</p>' +
    '<textarea readonly style="min-height:260px;font-size:12px;font-family:\'IBM Plex Mono\',monospace">' + esc(conteudo) + '</textarea>',
    '<button class="btn btn-primary btn-block" data-copiar="1">Copiar tudo</button>');
  sheetSalvar = null;
  $("#sheetBody").querySelector("textarea").addEventListener("focus", e => e.target.select());
}

/* Um toque: monta o arquivo e abre a folha de compartilhamento do iPhone,
   de onde ela manda no WhatsApp, por e-mail ou salva nos Arquivos. */
function enviarBackup(){
  const nome = "mf-imports-backup-" + hoje() + ".json";
  const conteudo = JSON.stringify({ versao:1, exportadoEm:new Date().toISOString(), dados:S }, null, 2);
  let arquivo = null;
  try { arquivo = new File([conteudo], nome, { type:"application/json" }); } catch (e) {}

  if (arquivo && navigator.canShare && navigator.canShare({ files:[arquivo] })) {
    navigator.share({ files:[arquivo], title:"Backup MF Imports" })
      .then(() => { marcarBackup(); toast("Backup enviado."); })
      .catch(e => {
        if (e && (e.name === "AbortError" || e.name === "NotAllowedError")) return;
        exportar("json");
      });
    return;
  }
  exportar("json");
}

async function restaurarSnapshot(){
  let snap = null;
  try { snap = JSON.parse(localStorage.getItem(SNAP_KEY) || "null"); } catch (e) {}
  if (!snap || !snap.dados) { toast("Não há cópia guardada."); return; }
  const ok = await perguntar("Voltar para a cópia?",
    "Tudo volta a como estava no início do dia " + fmtData(snap.data) +
    ". O que você cadastrou depois disso se perde.", "Voltar");
  if (!ok) return;
  COLS.forEach(c => { S[c] = Array.isArray(snap.dados[c]) ? snap.dados[c] : []; });
  gravarLocal(true);
  if (dbRef) COLS.forEach(c => S[c].forEach(o => dbRef.collection(c).doc(o.id).set(o).catch(erroDb)));
  render();
  toast("Cópia do dia " + fmtData(snap.data) + " restaurada.");
}

async function importar(){
  const txt = $("#impTxt").value.trim();
  if (!txt) { toast("Cole o conteúdo do backup."); return; }
  let o;
  try { o = JSON.parse(txt); } catch (e) { toast("Esse texto não é um backup válido."); return; }
  const dados = o && o.dados ? o.dados : o;
  if (!dados || !Array.isArray(dados.vendas)) { toast("Esse backup não tem o formato esperado."); return; }
  const ok = await perguntar("Restaurar backup?",
    "Tudo que está cadastrado agora será substituído pelo conteúdo desse backup.", "Restaurar");
  if (!ok) return;
  COLS.forEach(c => { S[c] = Array.isArray(dados[c]) ? dados[c] : []; });
  gravarLocal();
  if (dbRef) COLS.forEach(c => S[c].forEach(o2 => dbRef.collection(c).doc(o2.id).set(o2).catch(erroDb)));
  render();
  toast("Backup restaurado.");
}

async function zerarTudo(){
  if (emDemo()) {
    const ok = await perguntar("Não há nada seu para apagar",
      "O que aparece nas telas são dados de exemplo, não cadastros seus. " +
      "Quer escondê-los e ficar com o caderno vazio?", "Esconder exemplos");
    if (ok) esconderExemplos();
    return;
  }
  const partes = [];
  if (S.vendas.length)   partes.push(S.vendas.length + (S.vendas.length === 1 ? " venda" : " vendas"));
  if (S.compras.length)  partes.push(S.compras.length + (S.compras.length === 1 ? " compra" : " compras"));
  if (S.clientes.length) partes.push(S.clientes.length + (S.clientes.length === 1 ? " cliente" : " clientes"));
  if (S.produtos.length) partes.push(S.produtos.length + (S.produtos.length === 1 ? " perfume" : " perfumes"));
  if (!partes.length) { toast("Não há nada cadastrado."); return; }
  const ok = await perguntar("Apagar tudo?",
    "Isso apaga " + partes.join(", ").replace(/, ([^,]*)$/, " e $1") +
    " deste caderno. Não tem volta — se quiser guardar antes, cancele e faça um backup.",
    "Apagar tudo");
  if (!ok) return;
  COLS.forEach(c => {
    if (dbRef) S[c].forEach(o => dbRef.collection(c).doc(o.id).delete().catch(function(){}));
    S[c] = [];
  });
  gravarLocal();
  render();
  toast("Tudo apagado.");
}

document.addEventListener("click", async e => {
  const t = e.target;

  const tab = t.closest("[data-tab]");
  if (tab) { irPara(tab.dataset.tab); return; }

  const goto = t.closest("[data-goto]");
  if (goto) { irPara(goto.dataset.goto); return; }

  const chipEl = t.closest("[data-chip]");
  if (chipEl) { UI.filtroVendas = chipEl.dataset.chip; render(); return; }

  const chipPEl = t.closest("[data-chipp]");
  if (chipPEl) { UI.filtroParcelas = chipPEl.dataset.chipp; render(); return; }

  const chipHEl = t.closest("[data-chiph]");
  if (chipHEl) { UI.filtroHist = chipHEl.dataset.chiph; render(); return; }

  const aba = t.closest('[data-seg="aba"] button');
  if (aba) { UI.abaParcelas = aba.dataset.v; render(); return; }

  const bar = t.closest("[data-bar]");
  if (bar) { UI.barSel = Number(bar.dataset.bar); render(); return; }

  const abrir = t.closest("[data-abrir]");
  if (abrir) {
    const p = abrir.dataset.abrir.split(":");
    if (p[0] === "venda") detalheVenda(p[1]); else detalheCompra(p[1]);
    return;
  }

  const prod = t.closest("[data-produto]");
  if (prod) { formProduto(D().produtos.find(x => x.id === prod.dataset.produto)); return; }

  const cli = t.closest("[data-cliente]");
  if (cli) { formCliente(D().clientes.find(x => x.id === cli.dataset.cliente)); return; }

  const pagar = t.closest("[data-pagar]");
  if (pagar) {
    if (emDemo()) { toast("Isto é um exemplo. Cadastre uma venda de verdade."); return; }
    const p = pagar.dataset.pagar.split(":");
    alternarPago(p[0], p[1], Number(p[2]));
    return;
  }

  if (t.closest("[data-fechar]")) { fecharSheet(); return; }

  const salvarBtn = t.closest("[data-salvar],[data-salvar-produto],[data-salvar-cliente]");
  if (salvarBtn) { if (sheetSalvar) sheetSalvar(); return; }

  const apV = t.closest("[data-apagar-venda]");
  if (apV) {
    const v = D().vendas.find(x => x.id === apV.dataset.apagarVenda);
    if (await perguntar("Excluir a venda?",
      "A ordem de compra " + ((v && v.oc) || "") + " sai do histórico do cliente e das contas a receber.",
      "Excluir")) { apagar("vendas", apV.dataset.apagarVenda); fecharSheet(); toast("Venda excluída."); }
    return;
  }

  const apC = t.closest("[data-apagar-compra]");
  if (apC) {
    if (await perguntar("Excluir a compra?",
      "As unidades dessa compra saem do estoque e as parcelas saem das contas a pagar.",
      "Excluir")) { apagar("compras", apC.dataset.apagarCompra); fecharSheet(); toast("Compra excluída."); }
    return;
  }

  const apP = t.closest("[data-apagar-produto]");
  if (apP) {
    if (await perguntar("Excluir o perfume?",
      "As vendas e compras já registradas continuam no histórico.",
      "Excluir")) { apagar("produtos", apP.dataset.apagarProduto); fecharSheet(); toast("Perfume excluído."); }
    return;
  }

  const apCl = t.closest("[data-apagar-cliente]");
  if (apCl) {
    if (await perguntar("Excluir o cliente?",
      "As vendas dele continuam registradas, mas deixam de ficar agrupadas por esse celular.",
      "Excluir")) { apagar("clientes", apCl.dataset.apagarCliente); fecharSheet(); toast("Cliente excluído."); }
    return;
  }

  const edV = t.closest("[data-editar-venda]");
  if (edV) { formVenda(S.vendas.find(x => x.id === edV.dataset.editarVenda)); return; }

  const edC = t.closest("[data-editar-compra]");
  if (edC) { formCompra(S.compras.find(x => x.id === edC.dataset.editarCompra)); return; }

  const exp = t.closest("[data-exp]");
  if (exp) { exportar(exp.dataset.exp); return; }

  if (t.closest("[data-sem-exemplos]")) { esconderExemplos(); return; }
  if (t.closest("[data-enviar]")) { enviarBackup(); return; }
  if (t.closest("[data-restaurar-snap]")) { restaurarSnapshot(); return; }
  if (t.closest("[data-imp]")) { importar(); return; }
  if (t.closest("[data-zerar]")) { zerarTudo(); return; }

  const cop = t.closest("[data-copiar]");
  if (cop) {
    const ta = $("#sheetBody").querySelector("textarea");
    ta.select();
    navigator.clipboard ? navigator.clipboard.writeText(ta.value).then(() => toast("Copiado.")) : toast("Selecione e copie.");
    return;
  }
});
